<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metra Copilot</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- All scripts are served from this origin (see /vendor and /app.js):
       no third-party CDN can swap out React or, more importantly, DOMPurify,
       which is the only thing standing between model-generated HTML and the DOM.
       app.js is prebuilt from app.jsx (see README "Frontend build"). -->
  <script src="/vendor/tailwind-3.4.16.js"></script>
  <script src="/vendor/tailwind-config.js"></script>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; transition: background 0.15s; }
    html.dark body { background: #09090b; }
    html:not(.dark) body { background: #fafafa; }
    #root { display: flex; justify-content: center; padding: 20px; }
    .app-container { width: 100%; max-width: 720px; }
  </style>
</head>
<body>
  <div id="root"><div class="app-container"></div></div>

  <script src="/app.js"></script>
</body>
</html>
